[package]
name = "haven-desktop"
version = "4.29.0"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/khanhtg2011/haven-desktop"
description = "Haven Desktop client engine in Rust: system loopback audio, global Push-To-Talk hotkeys, voice overlay"

[[bin]]
name = "haven-desktop"
path = "src/main.rs"

[dependencies]
haven-desktop-core = { path = "crates/haven-desktop", package = "haven-desktop" }
tokio = { version = "1.43", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
cpal = "0.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
