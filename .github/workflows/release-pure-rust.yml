name: Build & Release Haven Pure Rust (Pre-Release)

on:
  push:
    branches:
      - mobile
      - main
    tags:
      - 'v*-pre*'
      - 'v*-alpha*'
      - 'v*-beta*'
      - 'v*-rust*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for pre-release (e.g. v0.2.0-pre.1)'
        required: false
        default: 'v0.2.0-pre.1'

permissions:
  contents: write

jobs:
  build-release-pure-rust:
    name: Build Pure Rust Native Client (Pre-Release)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './crates/haven-native -> target'

      - name: Run E2E Native Tests
        run: cargo test --test e2e_native_test --manifest-path crates/haven-native/Cargo.toml -- --nocapture

      - name: Build Release Binary
        run: cargo build --release --manifest-path crates/haven-native/Cargo.toml

      - name: Package Executable
        run: |
          Copy-Item -Path "crates/haven-native/target/release/haven-native.exe" -Destination "haven-desktop-pure-rust.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-pure-rust-windows-x64
          path: haven-desktop-pure-rust.exe

      - name: Create GitHub Pre-Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Haven Pure Rust Native (Pre-Release)
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            ## 🚧 Haven Pure Rust Native - Pre-Release Build
            * **Lưu ý:** Bản thử nghiệm đánh giá (Pre-release). Bản phát hành chính thức sẽ chỉ được tung ra sau khi có sự kiểm duyệt và phê duyệt hoàn chỉnh từ người dùng.
            * **Đặc tính:** 100% Rust Native (Zero Chromium / Zero WebView2), RAM ~46MB, khởi động <50ms.
            * **Tính năng:**
              - System Tray & Hotkey PTT CapsLock
              - Gửi & xem ảnh / tệp đính kèm
              - WebRTC Voice Room Signaling & Audio Engine
              - In-game Click-through HUD Overlay
          prerelease: true
          draft: false
          files: |
            haven-desktop-pure-rust.exe
