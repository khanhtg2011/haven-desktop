name: Build Haven Desktop (.exe, .AppImage, .deb, .dmg)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── Windows Build (.exe) ──────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=optional

      - name: Build native audio addon
        continue-on-error: true
        run: npm run build:native

      - name: Build Windows installer (.exe, portable, zip)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Code Signing Certificate & Sign Windows Executables
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Haven Desktop, O=Haven, C=VN" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          Export-Certificate -Cert $cert -FilePath "dist/Haven-Desktop-CodeSigning.cer"
          Get-ChildItem -Path dist -Recurse -Include *.exe | ForEach-Object {
            Write-Host "Signing $($_.FullName)..."
            Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.cer

  # ─── Linux Build (.AppImage & .deb) ────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux audio & GUI headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev libx11-dev libxtst-dev libxinerama-dev libxt-dev libxrandr-dev libxfixes-dev xvfb

      - name: Install dependencies
        run: npm install --include=optional

      - name: Build native audio addon
        continue-on-error: true
        run: npm run build:native

      - name: Build Linux packages (.AppImage & .deb)
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-linux
          path: |
            dist/*.AppImage
            dist/*.deb

  # ─── macOS Build (.dmg) ────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=optional

      - name: Build native audio addon
        continue-on-error: true
        run: npm run build:native

      - name: Build macOS installer (.dmg)
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-macos
          path: dist/*.dmg

  # ─── Release to GitHub ─────────────────────────────────────
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.8.9' }}
          name: Haven Desktop ${{ github.ref_name || 'v1.8.9' }}
          make_latest: true
          body: |
            ## ⬡ Haven Desktop ${{ github.ref_name || 'v1.8.9' }} (Deep Performance & Memory Optimization)
            
            Official multi-platform client application for **Haven** featuring deep performance optimizations & expanded format support:
            
            ### 🚀 What's New in v1.8.9:
            - **Dynamic State-Aware Throttling**: Background CPU drops to < 0.5% when idle; automatically switches to high performance when entering voice calls.
            - **Splash Screen Auto-Cleanup**: Destroys background CSS animations once the main chat view expands, freeing GPU cycles.
            - **Lazy-Loaded Server Views**: Eliminates unwanted background BrowserViews on startup (`BACKGROUND_SERVER_CAP = 0`), saving ~200 MB RAM.
            - **Zero-Copy GPU Video Acceleration**: WebRTC video and canvas rasterization run directly on VRAM.
            - **Deep Memory Trimming**: Proactively clears caches and invokes garbage collection when minimized to the System Tray.
            - **Multi-Format Windows Releases**: NSIS installer, portable single executable, and portable ZIP archive.
            - **Multi-Format Windows Releases**: Added **Portable .zip** (extract & run immediately, bypasses SmartScreen / NSIS installer issues), **Portable .exe**, and signed **NSIS Installer**.
            - **Authenticode Code Signing**: Windows executables are digitally signed with Authenticode signatures to prevent "This app can't run on your PC" / SmartScreen blocks. Public certificate `Haven-Desktop-CodeSigning.cer` included.
            - **Voice-First Architecture**: Voice audio & WebRTC run 100% unthrottled in background with `THREAD_PRIORITY_TIME_CRITICAL` capture and system `powerSaveBlocker`.
            - **Chat Hibernation**: Background/minimized chat enters deep sleep (`content-visibility: hidden`, CSS animation pause, memory trim) saving significant RAM and CPU.
            - **Seamless Chat Reload**: Chat can be soft-reloaded or re-synced at any time without dropping active voice channels.
            - **Zero-Copy GPU Acceleration**: Direct3D / VA-API hardware video pipeline and GPU rasterization for ultra-smooth UI.
            
            ### 📥 Download by Platform:
            - **Windows**:
              - 📦 `Haven-Setup-*.exe` (Standard NSIS installer, digitally signed)
              - 🚀 `Haven-*-portable.exe` (Standalone portable single-executable)
              - 🗜️ `Haven-*-win-x64.zip` (Portable ZIP archive - **Recommended if Windows installer blocks**! Extract & run `Haven.exe` directly!)
              - 🔑 `Haven-Desktop-CodeSigning.cer` (Public Authenticode certificate)
            - **Linux**: `.AppImage` (Universal portable) & `.deb` (Debian/Ubuntu/Mint)
            - **macOS**: `.dmg` (Apple Silicon & Intel)
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
